services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docai-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docai}
      POSTGRES_USER: ${POSTGRES_USER:-docai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docai123}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docai} -d ${POSTGRES_DB:-docai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: docai-silo
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_UI_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - ./data/silo:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: docai-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 后端应用（Spring Boot）
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docai-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-docai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-docai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-docai123}
      MINIO_ENDPOINT: http://silo:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-docai}
      # 模型密钥：从项目根 .env 注入，留空则自动降级 Mock
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
    volumes:
      - ./data/versions:/app/data/versions
      - ./data/exports:/app/data/exports
    depends_on:
      postgres:
        condition: service_healthy
      silo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 前端（Nginx 静态资源 + /api 反向代理）
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docai-web
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - app
