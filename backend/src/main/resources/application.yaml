spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docai}
    username: ${DB_USERNAME:docai}
    password: ${DB_PASSWORD:docai123}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:docai}

security:
  jwt:
    secret: ${JWT_SECRET:doc-ai-platform-dev-secret-key-please-change-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
