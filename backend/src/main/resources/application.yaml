spring:
  application:
    name: backend
  datasource:
    # 默认指向本机容器；Docker 部署时由 compose 注入容器内主机名
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docai}
    username: ${SPRING_DATASOURCE_USERNAME:docai}
    password: ${SPRING_DATASOURCE_PASSWORD:docai123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:docai}

# ============================================================
# LLM 网关（对话）与 Embedding（向量化）配置。
# 敏感密钥一律用环境变量占位：${VAR:} 表示"读环境变量 VAR，缺省为空串"。
# 注意：不要写 ${VAR:-default} 形式（在部分沙箱环境会被误解析）。
# 请在项目根 .env 或系统环境变量中设置：
#   LLM_API_KEY          DeepSeek 对话 key（留空=自动降级 Mock）
#   EMBEDDING_API_KEY    通义 text-embedding-v3 key（留空=向量检索降级为关键词召回）
# ============================================================
llm:
  provider: ${LLM_PROVIDER:deepseek}     # deepseek / qwen(通义) / glm
  api-key: ${LLM_API_KEY:}               # >>> 需要你自己填写（见 .env）
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  model: ${LLM_MODEL:deepseek-flash}     # 官方模型名：deepseek-flash / deepseek-v4-pro

embedding:
  provider: ${EMBEDDING_PROVIDER:qwen}   # qwen(通义) / openai 兼容
  api-key: ${EMBEDDING_API_KEY:}         # >>> 需要你自己填写（见 .env）
  base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  model: ${EMBEDDING_MODEL:text-embedding-v3}
  dimension: ${EMBEDDING_DIMENSION:1536} # 通义 text-embedding-v3 默认 1536 维

# ============================================================
# 认证与初始化
# JWT_SECRET 必须 >= 32 字节，生产环境请务必通过环境变量覆盖
# ============================================================
jwt:
  secret: ${JWT_SECRET:doc-ai-platform-local-dev-secret-key-change-me-2026}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

app:
  init:
    admin-username: ${INIT_ADMIN_USERNAME:admin}
    admin-password: ${INIT_ADMIN_PASSWORD:admin123}
    demo-users: ${INIT_DEMO_USERS:true}

# 文档操作版本库与异步任务导出目录（均在 .gitignore 的 data/ 下）
doc:
  version:
    dir: ./data/versions
  export:
    dir: ./data/exports

server:
  port: 8080
